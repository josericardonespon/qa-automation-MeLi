name: CI/CD - Pipeline MeLi

on:
  pull_request:
    branches: [ master ]

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Cucumber a ejecutar"
        required: true
        default: "@FlujosCompletosConEventos"

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
  
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Spanish locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen es_ES.UTF-8


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'


      - name: Install Chrome for Testing
        run: |
          npm i puppeteer
          npx @puppeteer/browsers install chrome@stable


      - name: Set UAT credentials
        run: |
          echo "SALESFORCE_USERNAME=${{ secrets.SALESFORCE_USERNAME_UAT }}" >> $GITHUB_ENV
          echo "SALESFORCE_PASSWORD=${{ secrets.SALESFORCE_PASSWORD_UAT }}" >> $GITHUB_ENV
          echo "Seleccionado ambiente: UAT"


      - name: Run tests
        env:
          SALESFORCE_USERNAME_UAT: ${{ secrets.SALESFORCE_USERNAME_UAT }}
          SALESFORCE_PASSWORD_UAT: ${{ secrets.SALESFORCE_PASSWORD_UAT }}
        run: |
          export LANG=es_ES.UTF-8
          export LC_ALL=es_ES.UTF-8

          TAG_TO_RUN="${{ github.event.inputs.tag }}"

          echo "Ejecutando pruebas en UAT"
          echo "Tag ejecutado: $TAG_TO_RUN"

          mvn clean verify \
            -Denvironment=uat \
            "-Dcucumber.filter.tags=$TAG_TO_RUN"

        continue-on-error: true


      - name: Deploy report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          branch: gh-pages
          folder: target/site/serenity
          clean: true
